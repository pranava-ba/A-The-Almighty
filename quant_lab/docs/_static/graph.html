    ctx.globalAlpha=fade?.25:1;ctx.fillStyle=COL[n.type]||COL.fg;
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();
    if(n.type==='section'){ctx.globalAlpha=fade?.35:1;ctx.fillStyle=COL.fg;ctx.font='600 11px sans-serif';
      ctx.fillText(n.label,n.x+r+3,n.y+4);}
  }
  ctx.globalAlpha=1;
}
let reheat=90;  // brief settle from the baked layout; reheated on drag
function loop(){if(reheat>0){step();reheat--;}draw();requestAnimationFrame(loop);}
loop();

function pick(mx,my){let best=null,bd=1e9;for(const n of N){const dx=n.x-mx,dy=n.y-my,d=dx*dx+dy*dy;
  const r=R(n)+4;if(d<r*r&&d<bd){bd=d;best=n;}}return best;}
cvs.addEventListener('mousemove',e=>{const mx=e.clientX,my=e.clientY;
  if(drag){drag.x=mx;drag.y=my;drag.vx=drag.vy=0;reheat=Math.max(reheat,40);}
  hover=pick(mx,my);
  if(hover){tip.style.opacity=1;tip.style.left=(mx+14)+'px';tip.style.top=(my+14)+'px';
    tip.innerHTML='<b>'+hover.label+'</b><br><span style="color:var(--muted)">'+hover.type+'</span>';}
  else tip.style.opacity=0;
  cvs.style.cursor=hover?'pointer':'default';});
cvs.addEventListener('mousedown',e=>{drag=pick(e.clientX,e.clientY);if(drag)reheat=Math.max(reheat,40);});
addEventListener('mouseup',()=>{drag=null;});
const mq=matchMedia('(prefers-color-scheme:dark)');mq.addEventListener&&mq.addEventListener('change',loadColors);
</script>
